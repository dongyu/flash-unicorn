services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: unicorn
      POSTGRES_PASSWORD: unicorn
      POSTGRES_DB: unicorn
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U unicorn -d unicorn"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    build:
      context: .
    entrypoint: ["/app/scripts/migrate.sh", "up"]
    environment:
      DATABASE_URL: postgres://unicorn:unicorn@postgres:5432/unicorn?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: .
    environment:
      APP_ENV: production
      SERVER_MODE: api
      HTTP_ADDR: ":3331"
      DATABASE_URL: postgres://unicorn:unicorn@postgres:5432/unicorn?sslmode=disable
      LOG_LEVEL: info
      LOG_FORMAT: json
    ports:
      - "3331:3331"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:3331/healthz >/dev/null || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5

  worker:
    build:
      context: .
    environment:
      APP_ENV: production
      SERVER_MODE: worker
      DATABASE_URL: postgres://unicorn:unicorn@postgres:5432/unicorn?sslmode=disable
      LOG_LEVEL: info
      LOG_FORMAT: json
      RIVER_MAX_WORKERS: "20"
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  pgdata:
